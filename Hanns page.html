<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="hanns_style.css">
    <title id="title">Hanns von Fortinbrack</title>
</head>

<body>
    <audio id="partyMusic" src="https://www.youtube.com/watch?v=eVli-tstM5E" loop></audio>
    <p class="hello">Hello, welcome to this website!</p>

    <main class="hanns" id="main">
        <h1 class="title" id="title">Hanns von Fortinbrack</h1>
        <div id="img-div">
            <img src="https://images.saymedia-content.com/.image/t_share/MTc0NDI5MTc5NzI1NDg5Nzk4/top-10-greatest-leonardo-dicaprio-movies.jpg"
                alt="img von leo als hanns" class="image" id="image">
            <button class="toggleButton party" id="toggleButton"><span class="bold">Hier</span> 2 weitere Hanns-Bilder
                anzeigen 🦄 :)</button>
            <div id="toggleContent" style="display: none;">
                <img src="images/Unicorn pictures.png" alt="einhorn" width="300" class="image1-1" id="image">
                <img src="https://masterpiecer-images.s3.yandex.net/e14cc1f0550e11ee90e4baea8797b5f2:upscaled" alt=""
                    width="300" class="image1-2" id="image2">
            </div>
        </div>
        <script>
            document.getElementById("toggleButton").addEventListener("click", function () {
                var content = document.getElementById("toggleContent");
                if (content.style.display === "none") {
                    content.style.display = "block";

                    const defaults = {
                        spread: 360,
                        ticks: 100,
                        gravity: 0,
                        decay: 0.94,
                        startVelocity: 30,
                        shapes: ["heart"],
                        colors: ["FFC0CB", "FF69B4", "FF1493", "C71585"],
                    };

                    confetti({
                        ...defaults,
                        particleCount: 50,
                        scalar: 2,
                    });

                    confetti({
                        ...defaults,
                        particleCount: 25,
                        scalar: 3,
                    });

                    confetti({
                        ...defaults,
                        particleCount: 10,
                        scalar: 4,
                    });
                } else {
                    content.style.display = "none";
                }
            });
        </script>
        <div id="img-caption">
            <p id="tribute-info">Hanns ist der coolste Character in der
                <a target="_blank" href="https://www.amazon.de/Die-Sumpfloch-Saga/dp/B07F7PCH5F" id="tribute-link"><span
                        class="bold">Sumpfloch-Saga</span> von Helo Summer</a>

            </p>
        </div>
        </div>

    </main>

    <div class="gerald">
        <div class="caption">
            <header>Gerald Winter</header>
        </div>
        <img src="https://miro.medium.com/v2/resize:fit:1400/0*UJmHzcUXJ6ozCqbF.jpg" alt="gerald" class="image">
    </div>

    <div class="Racki">
        <div class="caption2">
            <header>Rackiné</header>
        </div>
        <img src="images/Rackine.png" alt="Rackiné" class="image">
    </div>

    <div class="lizzy">
        <div class="caption2 caption-lizzy">
            <header>Esthephaga Glazar</header>
        </div>
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/23/Bufo_terrestris3.jpg" alt="Lisandra"
            class="image">
    </div>

    <div class="grohan">
        <div class="caption2 caption-grohan">
            <header>Grohan</header>
        </div>
        <img src="images/Grohan-goat.png" alt="Lisandra" class="image">
    </div>

    <div class="Hylda">
        <div class="caption2 caption-hylda">
            <header>Hylda 🌹</header>
        </div>
        <img src="images/Hylda-wensday.jpg" alt="Hylda" class="image bright-image">

        <img src="images/Hylda-cat1.jpg" class="image">
    </div>

    <blockquote>
        <hr />
        <p>Tell me what else characters I should portray <span class="bold">:)</span></p>
        <br><br>
        <form id="commentForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="z.B. Krotan Westbarsch">
            <br><br>
            <label for="nachricht">Nachricht:</label>
            <textarea id="nachricht" name="nachricht" placeholder="Wo ist unser Mungo Bartock?" rows="4"
                cols="50"></textarea>
            <br><br>

            <button class="submit" type="submit">Absenden!</button>

        </form>
        <hr />
        <div id="commentsSection"></div>
    </blockquote>
    <div class="sun">
        <div class="sky">
            <div class="sky__phase sky__dawn"></div>
            <div class="sky__phase sky__noon"></div>
            <div class="sky__phase sky__dusk"></div>
            <div class="sky__phase sky__midnight">
                <div id="sky__stars"></div>
            </div>
            <div class="orbit">
                <div class="sun"></div>
                <div class="moon"></div>
            </div>

            <button class="partyButton" id="partyButton">Party Mood</button>
            <script defer src="script.js"></script>


            <div class="firework-animation" id="fireworkAnimation">
                <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs"
                    type="module"></script>
                <dotlottie-player src="https://lottie.host/b358d26d-ee26-4ffd-a94c-313ab7f49a8e/MryDtIJWbb.lottie"
                    background="transparent" speed="1" style="width: 300px; height: 300px" loop
                    autoplay></dotlottie-player>
            </div>
            <script>
                //firework        
                setTimeout(function() {
                    document.getElementById('fireworkAnimation').style.display = 'none';
                }, 5000);
                //button hello
                setTimeout(function() {
                    document.querySelector('.hello').style.display = 'none';
                }, 5000);
            </script>


</body>

</html>
